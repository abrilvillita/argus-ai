<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Argus AI — No-Code IoT Anomaly Detection</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="eye">◎</span>
      <div>
        <h1>Argus AI</h1>
        <p>No-code IoT anomaly detection &amp; auto-remediation</p>
      </div>
    </div>
    <div class="status" id="ws-status">connecting…</div>
  </header>

  <main class="grid">
    <section class="panel devices">
      <h2>Fleet</h2>
      <div id="device-list" class="device-list"></div>
    </section>

    <section class="panel charts">
      <h2>Live telemetry</h2>
      <div class="chart-tabs" id="chart-tabs"></div>
      <canvas id="metric-chart" height="140"></canvas>
    </section>

    <section class="panel rules">
      <h2>No-code rule builder</h2>
      <form id="rule-form">
        <input name="name" placeholder="Rule name (e.g. Furnace overheat)" required />
        <select name="device_id" id="rule-device"><option value="*">Any device</option></select>
        <select name="metric">
          <option value="temperature">temperature</option>
          <option value="humidity">humidity</option>
          <option value="vibration">vibration</option>
        </select>
        <select name="operator">
          <option value="gt">is greater than</option>
          <option value="lt">is less than</option>
          <option value="gte">is ≥</option>
          <option value="lte">is ≤</option>
        </select>
        <input name="threshold" type="number" step="0.01" placeholder="threshold" required />
        <select name="action">
          <option value="notify">Notify only</option>
          <option value="throttle_device">Throttle device</option>
          <option value="shutdown_device">Shutdown device</option>
          <option value="dispatch_technician">Dispatch technician</option>
        </select>
        <button type="submit">+ Add rule</button>
      </form>
      <ul id="rule-list" class="rule-list"></ul>
    </section>

    <section class="panel alerts">
      <h2>Alerts &amp; auto-remediation log</h2>
      <ul id="alert-list" class="alert-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
